[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrcode-gui"
version = "0.2.0"
description = "QR code generator and webcam scanner for Linux desktops"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "qrcode>=8,<9", "opencv-python-headless>=4.10,<5", "zxing-cpp>=2.2,<4"]

[project.scripts]
qrcode-gui = "qrcode_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
