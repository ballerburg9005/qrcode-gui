name: qrcode-gui
base: core24
version: '0.2.0'
summary: Generate QR codes and scan with a webcam
description: |
  Generate and save QR codes, scan QR codes with a Linux webcam or image,
  and copy the decoded results. Includes a high-resolution camera mode and
  a robust ZXing-C++ decoder. Works without accounts or cloud services.
icon: snap/gui/qrcode-gui.svg
website: https://github.com/ballerburg9005/qrcode-gui
grade: devel
confinement: strict

apps:
  qrcode-gui:
    command: bin/qrcode-gui
    plugs:
      - camera
      - x11
      - desktop
      - desktop-legacy
      - home
    environment:
      TCL_LIBRARY: $SNAP/usr/share/tcltk/tcl8.6
      TK_LIBRARY: $SNAP/usr/share/tcltk/tk8.6
      PYTHONPATH: $SNAP/lib/python3.12/site-packages:$SNAP/usr/lib/python3/dist-packages:$SNAP/usr/lib/python3.12:$SNAP/usr/lib/python3.12/lib-dynload

parts:
  qrcode-gui:
    plugin: python
    source: .
    stage-packages:
      - python3-tk
      - tcl8.6
      - tk8.6
      - libx11-6
      - libxext6
      - libxrender1
      - libsm6
      - libice6
